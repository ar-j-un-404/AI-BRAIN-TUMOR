name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app research_suite experiments launch.py configure_windows.py
      - run: python -m unittest discover -s tests -p 'test_repository.py'
